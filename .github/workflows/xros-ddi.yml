name: Extract xrOS Developer Disk Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xros-ddi.yml']

permissions:
  contents: write

jobs:
  extract:
    runs-on: xcode-27
    steps:
      - name: Find xrOS DDI
        run: |
          note() { while IFS= read -r l; do echo "::notice::$l"; done; }
          xcodebuild -version | note
          XC=$(cd "$(xcode-select -p)/../.." && pwd); echo "Xcode: $XC" | note
          ls "$XC/Contents/Resources/CoreDeviceDDIs" 2>&1 | note
          ls /Library/Developer/DeveloperDiskImages 2>&1 | note
          xcodebuild -showsdks 2>/dev/null | grep -i xr | note
          ls /Applications | grep -i xcode | note
          (find /Applications/Xcode*.app/Contents/Resources /Library/Developer -maxdepth 3 -iname "*DDI*" 2>/dev/null | head -30) | note

      - name: Collect files
        run: |
          set -e
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p out/DDI
          XC=$(cd "$(xcode-select -p)/../.." && pwd)
          SRC=""
          if [ -d /Library/Developer/DeveloperDiskImages/xrOS_DDI ]; then
            SRC=/Library/Developer/DeveloperDiskImages/xrOS_DDI
          elif [ -f "$XC/Contents/Resources/CoreDeviceDDIs/xrOS_DDI.dmg" ]; then
            hdiutil attach -nobrowse -readonly -mountpoint /tmp/xrosddi "$XC/Contents/Resources/CoreDeviceDDIs/xrOS_DDI.dmg"
            SRC=/tmp/xrosddi
          fi
          [ -n "$SRC" ] || { echo "::error::xrOS DDI not found on this runner"; exit 1; }
          echo "Source: $SRC"
          (cd "$SRC" && find . -maxdepth 5 -exec ls -ld {} \; | head -60) | while IFS= read -r l; do echo "::notice::$l"; done
          M="$SRC/Restore/BuildManifest.plist"
          python3 - "$M" <<'EOF' > picks.txt
          import plistlib,sys
          m=plistlib.load(open(sys.argv[1],'rb'))
          print("::notice::ProductVersion", m.get('ProductVersion'), "Build", m.get('ProductBuildVersion'))
          for i,bi in enumerate(m['BuildIdentities']):
              info=bi.get('Info',{})
              print(f"::notice::identity {i} {info.get('DeviceClass')} {info.get('Variant')} keys={sorted(bi['Manifest'].keys())}")
              for k,v in bi['Manifest'].items():
                  print(f"::notice::  {k} -> {v.get('Info',{}).get('Path')}")
          bi=m['BuildIdentities'][0]['Manifest']
          dmg=bi.get('PersonalizedDMG',{}).get('Info',{}).get('Path')
          tc=bi.get('LoadableTrustCache',{}).get('Info',{}).get('Path')
          print(f"PICK {dmg}|{tc}")
          EOF
          cat picks.txt | grep "::notice::" || true
          PICK=$(grep '^PICK ' picks.txt | cut -c6-)
          DMG=${PICK%%|*}; TC=${PICK##*|}
          echo "::notice::dmg=$DMG trustcache=$TC"
          cp "$SRC/Restore/$DMG" out/DDI/Image.dmg
          cp "$SRC/Restore/$TC" out/DDI/Image.dmg.trustcache
          cp "$M" out/DDI/BuildManifest.plist
          ls -la out/DDI
          (cd out && zip -qry ../xrOS_DDI.zip DDI)

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete xros-ddi --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create xros-ddi xrOS_DDI.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "xrOS Developer Disk Image" \
            --notes "Image.dmg, Image.dmg.trustcache y BuildManifest.plist de $(xcodebuild -version | head -1). Copiar la carpeta DDI dentro de Documentos de StikDebug."
