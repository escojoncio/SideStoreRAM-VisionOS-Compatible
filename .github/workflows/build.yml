name: Build SideStore (RAM)

# GitHub Actions minutes: this only runs when asked for - by hand (Actions > Run workflow) or
# for a push whose commit message has [build] in it.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/xros-ddi.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  SIDESTORE_REPO: https://github.com/SideStore/SideStore
  # develop @ 2026-10-13 (SideSign 752d1ef: 2FA 409 fix, minimuxer 12be70d)
  SIDESTORE_COMMIT: 12ff39c6b6c0ccd8180f0834a893a4bbaf7bcd31

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: macos-26
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Fetch SideStore source
        run: |
          git clone --filter=blob:none "$SIDESTORE_REPO" upstream
          cd upstream
          git checkout -q "$SIDESTORE_COMMIT"
          git submodule update --init --recursive
          git log -1 --format='SideStore %h %ad'
          git submodule status

      - name: Apply patches
        run: |
          cd upstream
          git apply --verbose ../patches/sidestore.patch
          git -C Dependencies/SideSign apply --verbose ../../../patches/sidesign.patch

      - name: Setup tools
        run: |
          brew install ldid xcbeautify
          XCODE=$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build
        working-directory: upstream
        run: |
          mkdir -p build/logs
          set -o pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | tee build/logs/build.log | xcbeautify --renderer github-actions
          make fakesign 2>&1 | tee -a build/logs/build.log
          make ipa 2>&1 | tee -a build/logs/build.log

      - name: Strip extensions and package
        run: |
          rm -rf work && mkdir work && cd work
          unzip -q ../upstream/SideStore.ipa
          echo "Removing extensions:"; ls Payload/SideStore.app/PlugIns || true
          rm -rf Payload/SideStore.app/PlugIns
          BIN=Payload/SideStore.app/SideStore
          grep -q INCREASED_MEMORY_LIMIT "$BIN" || { echo "::error::RAM patch missing from binary"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/SideStore.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/SideStore.app/Info.plist
          zip -qry -X ../SideStoreRAM.ipa Payload
          cd .. && ls -la SideStoreRAM.ipa

      - name: Report build errors
        if: failure()
        run: |
          LOG=upstream/build/logs/build.log
          [ -f "$LOG" ] || exit 0
          grep -E "error:|fatal error|\*\* ARCHIVE FAILED" "$LOG" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStoreRAM.ipa
          path: SideStoreRAM.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest SideStoreRAM.ipa \
            --title "SideStore RAM" \
            --notes "SideStore ${SIDESTORE_COMMIT:0:7} sin extensiones y con Increased Memory Limit automático. Build ${GITHUB_SHA:0:7}."
